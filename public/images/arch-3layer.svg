<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <linearGradient id="bg-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0B07"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>
    <linearGradient id="gold-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(201,168,76,0.12)"/>
      <stop offset="100%" stop-color="rgba(201,168,76,0.04)"/>
    </linearGradient>
    <linearGradient id="rose-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(232,160,128,0.12)"/>
      <stop offset="100%" stop-color="rgba(232,160,128,0.04)"/>
    </linearGradient>
    <linearGradient id="copper-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(232,106,40,0.12)"/>
      <stop offset="100%" stop-color="rgba(232,106,40,0.04)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#bg-g)"/>
  <!-- Subtle grain texture via fine dots -->
  <rect width="1200" height="520" fill="none" stroke="rgba(201,168,76,0.03)" stroke-width="0.5"/>

  <!-- Top label -->
  <text x="600" y="52" font-family="'Cinzel', Georgia, serif" font-size="11" letter-spacing="4" text-anchor="middle" fill="rgba(201,168,76,0.55)">PRODUCT ARCHITECTURE · 产品架构</text>

  <!-- Main title -->
  <text x="600" y="96" font-family="'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="600" letter-spacing="2" text-anchor="middle" fill="#F2E8B4">三层叙事架构</text>

  <!-- Subtitle -->
  <text x="600" y="128" font-family="Georgia, serif" font-size="14" letter-spacing="1" text-anchor="middle" fill="rgba(201,168,76,0.6)">从「被动展示简历」升级为「主动交互的个人产品」</text>

  <!-- Decorative line -->
  <line x1="480" y1="145" x2="720" y2="145" stroke="rgba(201,168,76,0.25)" stroke-width="0.5"/>
  <circle cx="600" cy="145" r="2" fill="rgba(201,168,76,0.4)"/>

  <!-- Card 01: 展示层 -->
  <rect x="60" y="175" width="330" height="290" rx="8" fill="url(#gold-g)" stroke="rgba(201,168,76,0.22)" stroke-width="1"/>
  <!-- Top accent line -->
  <line x1="60" y1="175" x2="390" y2="175" stroke="rgba(201,168,76,0.5)" stroke-width="1.5"/>
  <!-- Number -->
  <text x="88" y="232" font-family="'Cinzel', Georgia, serif" font-size="48" font-weight="700" fill="rgba(201,168,76,0.12)" letter-spacing="-2">01</text>
  <!-- Title -->
  <text x="88" y="268" font-family="'Noto Serif SC', Georgia, serif" font-size="20" font-weight="600" fill="#E8A080" letter-spacing="2">展示层</text>
  <!-- Divider -->
  <line x1="88" y1="280" x2="362" y2="280" stroke="rgba(201,168,76,0.12)" stroke-width="0.5"/>
  <!-- Content lines -->
  <text x="88" y="310" font-family="Georgia, serif" font-size="13" fill="rgba(228,208,128,0.75)" letter-spacing="0.5">让用户愿意探索你的第一印象</text>
  <text x="88" y="338" font-family="Georgia, serif" font-size="13" fill="rgba(201,168,76,0.55)" letter-spacing="0.5">星球视觉 · 点位探索 · 解锁成就感</text>
  <text x="88" y="366" font-family="Georgia, serif" font-size="13" fill="rgba(201,168,76,0.55)" letter-spacing="0.5">「这个人是谁」的瞬间印象</text>
  <!-- Bottom tag -->
  <rect x="88" y="420" width="200" height="26" rx="3" fill="rgba(201,168,76,0.08)" stroke="rgba(201,168,76,0.2)" stroke-width="0.5"/>
  <text x="188" y="437" font-family="'Cinzel', Georgia, serif" font-size="10" text-anchor="middle" fill="rgba(201,168,76,0.65)" letter-spacing="2">重点：让用户愿意探索你</text>

  <!-- Arrow between 01 and 02 -->
  <line x1="398" y1="320" x2="430" y2="320" stroke="rgba(201,168,76,0.2)" stroke-width="0.5" stroke-dasharray="3 4"/>
  <path d="M428 316 L436 320 L428 324" fill="none" stroke="rgba(201,168,76,0.3)" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Card 02: 叙事层 -->
  <rect x="435" y="175" width="330" height="290" rx="8" fill="url(#gold-g)" stroke="rgba(201,168,76,0.22)" stroke-width="1"/>
  <line x1="435" y1="175" x2="765" y2="175" stroke="rgba(201,168,76,0.5)" stroke-width="1.5"/>
  <text x="463" y="232" font-family="'Cinzel', Georgia, serif" font-size="48" font-weight="700" fill="rgba(201,168,76,0.12)" letter-spacing="-2">02</text>
  <text x="463" y="268" font-family="'Noto Serif SC', Georgia, serif" font-size="20" font-weight="600" fill="#C9A84C" letter-spacing="2">叙事层</text>
  <line x1="463" y1="280" x2="737" y2="280" stroke="rgba(201,168,76,0.12)" stroke-width="0.5"/>
  <text x="463" y="310" font-family="Georgia, serif" font-size="13" fill="rgba(228,208,128,0.75)" letter-spacing="0.5">决定面试官是否认为你「有产品思维」</text>
  <text x="463" y="338" font-family="Georgia, serif" font-size="13" fill="rgba(201,168,76,0.55)" letter-spacing="0.5">能力星球 · 项目落地 · 文档规范</text>
  <text x="463" y="366" font-family="Georgia, serif" font-size="13" fill="rgba(201,168,76,0.55)" letter-spacing="0.5">PRD · 架构图 · 时间轴 · 洞察输出</text>
  <rect x="463" y="420" width="200" height="26" rx="3" fill="rgba(201,168,76,0.08)" stroke="rgba(201,168,76,0.2)" stroke-width="0.5"/>
  <text x="563" y="437" font-family="'Cinzel', Georgia, serif" font-size="10" text-anchor="middle" fill="rgba(201,168,76,0.65)" letter-spacing="2">重点：展现产品思维深度</text>

  <!-- Arrow between 02 and 03 -->
  <line x1="773" y1="320" x2="805" y2="320" stroke="rgba(201,168,76,0.2)" stroke-width="0.5" stroke-dasharray="3 4"/>
  <path d="M803 316 L811 320 L803 324" fill="none" stroke="rgba(201,168,76,0.3)" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Card 03: Agent 层 -->
  <rect x="810" y="175" width="330" height="290" rx="8" fill="url(#copper-g)" stroke="rgba(232,106,40,0.2)" stroke-width="1"/>
  <line x1="810" y1="175" x2="1140" y2="175" stroke="rgba(232,106,40,0.45)" stroke-width="1.5"/>
  <text x="838" y="232" font-family="'Cinzel', Georgia, serif" font-size="48" font-weight="700" fill="rgba(232,106,40,0.12)" letter-spacing="-2">03</text>
  <text x="838" y="268" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="600" fill="#E86A28" letter-spacing="3">AGENT 层</text>
  <line x1="838" y1="280" x2="1112" y2="280" stroke="rgba(232,106,40,0.12)" stroke-width="0.5"/>
  <text x="838" y="310" font-family="Georgia, serif" font-size="13" fill="rgba(228,208,128,0.75)" letter-spacing="0.5">从被动展示变为可对话的个人产品</text>
  <text x="838" y="338" font-family="Georgia, serif" font-size="13" fill="rgba(201,168,76,0.55)" letter-spacing="0.5">数字分身 · RAG 知识库 · 实时问答</text>
  <text x="838" y="366" font-family="Georgia, serif" font-size="13" fill="rgba(201,168,76,0.55)" letter-spacing="0.5">面试官直接提问，Agent 调用资料回答</text>
  <rect x="838" y="420" width="200" height="26" rx="3" fill="rgba(232,106,40,0.08)" stroke="rgba(232,106,40,0.2)" stroke-width="0.5"/>
  <text x="938" y="437" font-family="'Cinzel', Georgia, serif" font-size="10" text-anchor="middle" fill="rgba(232,106,40,0.65)" letter-spacing="2">重点：可对话的个人产品</text>

  <!-- Bottom watermark -->
  <text x="600" y="498" font-family="'Cinzel', Georgia, serif" font-size="10" letter-spacing="3" text-anchor="middle" fill="rgba(201,168,76,0.2)">PROJECT NEBULA · ARCHITECTURE</text>
</svg>
