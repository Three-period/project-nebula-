  <rect x="427" y="120" width="170" height="200" rx="6" fill="rgba(232,106,40,0.08)" stroke="rgba(232,106,40,0.28)" stroke-width="0.8"/>
  <line x1="427" y1="120" x2="597" y2="120" stroke="rgba(232,106,40,0.55)" stroke-width="1.5"/>
  <text x="447" y="149" font-family="'Cinzel', Georgia, serif" font-size="9" letter-spacing="2" fill="rgba(232,106,40,0.6)">核心开发 · PoC验证</text>
  <text x="447" y="180" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="700" fill="#E86A28">Claude</text>
  <line x1="447" y1="192" x2="577" y2="192" stroke="rgba(232,106,40,0.12)" stroke-width="0.5"/>
  <text x="447" y="218" font-family="Georgia, serif" font-size="12" fill="rgba(228,168,80,0.7)">概念验证 PoC</text>
  <text x="447" y="240" font-family="Georgia, serif" font-size="12" fill="rgba(228,168,80,0.7)">原型搭建</text>
  <text x="447" y="262" font-family="Georgia, serif" font-size="12" fill="rgba(228,168,80,0.7)">前端代码生成</text>
  <text x="447" y="284" font-family="Georgia, serif" font-size="12" fill="rgba(228,168,80,0.7)">动效制作</text>

  <!-- Arrow 3→4 -->
  <line x1="599" y1="220" x2="611" y2="220" stroke="rgba(201,168,76,0.18)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <path d="M610 217 L615 220 L610 223" fill="none" stroke="rgba(201,168,76,0.25)" stroke-width="0.8" stroke-linecap="round"/>

