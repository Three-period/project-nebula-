  <rect x="799" y="130" width="170" height="180" rx="6" fill="rgba(176,148,48,0.08)" stroke="rgba(176,148,48,0.25)" stroke-width="0.8"/>
  <line x1="799" y1="130" x2="969" y2="130" stroke="rgba(176,148,48,0.5)" stroke-width="1.5"/>
  <text x="819" y="158" font-family="'Cinzel', Georgia, serif" font-size="9" letter-spacing="2" fill="rgba(176,148,48,0.6)">AGENT / RAG 接入</text>
  <text x="819" y="185" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" fill="#D0B84A">Coze + Notion</text>
  <line x1="819" y1="198" x2="949" y2="198" stroke="rgba(176,148,48,0.12)" stroke-width="0.5"/>
  <text x="819" y="224" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.6)">问答 Agent 配置</text>
  <text x="819" y="246" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.6)">知识库导入</text>
  <text x="819" y="268" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.6)">RAG 接入</text>

  <!-- Arrow 5→6 -->
  <line x1="971" y1="220" x2="983" y2="220" stroke="rgba(201,168,76,0.18)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <path d="M982 217 L987 220 L982 223" fill="none" stroke="rgba(201,168,76,0.25)" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Card 6: 发布迭代 / GitHub + Cloudflare -->
  <rect x="985" y="130" width="170" height="180" rx="6" fill="rgba(201,168,76,0.06)" stroke="rgba(201,168,76,0.18)" stroke-width="0.8"/>
  <line x1="985" y1="130" x2="1155" y2="130" stroke="rgba(201,168,76,0.4)" stroke-width="1.5"/>
  <text x="1005" y="158" font-family="'Cinzel', Georgia, serif" font-size="9" letter-spacing="2" fill="rgba(201,168,76,0.5)">版本控制 · 部署</text>
  <text x="1005" y="183" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#E4D080">GitHub +</text>
  <text x="1005" y="205" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#E4D080">Cloudflare</text>
  <line x1="1005" y1="217" x2="1135" y2="217" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/>
  <text x="1005" y="242" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.55)">版本管理</text>
  <text x="1005" y="264" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.55)">部署上线</text>
  <text x="1005" y="286" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.55)">持续迭代</text>

  <!-- Feedback arrow at bottom (迭代反馈) -->
  <path d="M1070 320 Q600 348 140 320" fill="none" stroke="rgba(201,168,76,0.12)" stroke-width="0.8" stroke-dasharray="4 5"/>
  <path d="M143 317 L138 320 L143 323" fill="none" stroke="rgba(201,168,76,0.2)" stroke-width="0.8" stroke-linecap="round"/>
  <text x="600" y="340" font-family="'Cinzel', Georgia, serif" font-size="9" letter-spacing="2" text-anchor="middle" fill="rgba(201,168,76,0.25)">反馈迭代</text>

  <!-- Bottom watermark -->
  <text x="600" y="356" font-family="'Cinzel', Georgia, serif" font-size="10" letter-spacing="3" text-anchor="middle" fill="rgba(201,168,76,0.15)">PROJECT NEBULA · WORKFLOW STACK</text>
</svg>
