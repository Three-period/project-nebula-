  <line x1="413" y1="220" x2="425" y2="220" stroke="rgba(201,168,76,0.18)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <path d="M424 217 L429 220 L424 223" fill="none" stroke="rgba(201,168,76,0.25)" stroke-width="0.8" stroke-linecap="round"/>

