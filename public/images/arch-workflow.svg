<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0B07"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg2)"/>

  <!-- Top label -->
  <text x="600" y="46" font-family="'Cinzel', Georgia, serif" font-size="11" letter-spacing="4" text-anchor="middle" fill="rgba(201,168,76,0.55)">极客工具流 · WORKFLOW STACK</text>

  <!-- Main title -->
  <text x="600" y="86" font-family="'Cinzel', Georgia, serif" font-size="40" font-weight="700" letter-spacing="4" text-anchor="middle" fill="#C9A84C">Workflow Stack</text>

  <!-- Decorative line -->
  <line x1="460" y1="102" x2="740" y2="102" stroke="rgba(201,168,76,0.2)" stroke-width="0.5"/>

  <!-- Cards: 6 tools, evenly spaced -->
  <!-- Card width: 170px, gap: ~14px, total: 6×170 + 5×14 = 1020+70 = 1090, start x = (1200-1090)/2 = 55 -->

  <!-- Arrow connector definition -->
  <!-- We'll draw arrows between cards -->

  <!-- Card 1: 方案共创 / GPT / Gemini -->
  <rect x="55" y="130" width="170" height="180" rx="6" fill="rgba(201,168,76,0.06)" stroke="rgba(201,168,76,0.18)" stroke-width="0.8"/>
  <line x1="55" y1="130" x2="225" y2="130" stroke="rgba(201,168,76,0.4)" stroke-width="1.5"/>
  <text x="75" y="158" font-family="'Cinzel', Georgia, serif" font-size="9" letter-spacing="2" fill="rgba(201,168,76,0.5)">方案共创 · 需求拆解</text>
  <text x="75" y="188" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#E4D080">GPT / Gemini</text>
  <line x1="75" y1="200" x2="205" y2="200" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/>
  <text x="75" y="226" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.55)">需求拆解</text>
  <text x="75" y="248" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.55)">方案共创</text>
  <text x="75" y="270" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.55)">Prompt 迭代</text>

  <!-- Arrow 1→2 -->
  <line x1="227" y1="220" x2="239" y2="220" stroke="rgba(201,168,76,0.18)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <path d="M238 217 L243 220 L238 223" fill="none" stroke="rgba(201,168,76,0.25)" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Card 2: 视觉探索 / Google Stitch -->
  <rect x="241" y="130" width="170" height="180" rx="6" fill="rgba(201,168,76,0.06)" stroke="rgba(201,168,76,0.18)" stroke-width="0.8"/>
  <line x1="241" y1="130" x2="411" y2="130" stroke="rgba(201,168,76,0.4)" stroke-width="1.5"/>
  <text x="261" y="158" font-family="'Cinzel', Georgia, serif" font-size="9" letter-spacing="2" fill="rgba(201,168,76,0.5)">视觉探索 · 风格定义</text>
  <text x="261" y="188" font-family="'Cinzel', Georgia, serif" font-size="15" font-weight="700" fill="#E4D080">Google Stitch</text>
  <line x1="261" y1="200" x2="391" y2="200" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/>
  <text x="261" y="226" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.55)">前端风格探索</text>
  <text x="261" y="248" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.55)">视觉方向输出</text>
  <text x="261" y="270" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.55)">参考图生成</text>

