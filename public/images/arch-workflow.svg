  <rect x="613" y="130" width="170" height="180" rx="6" fill="rgba(201,168,76,0.06)" stroke="rgba(201,168,76,0.18)" stroke-width="0.8"/>
  <line x1="613" y1="130" x2="783" y2="130" stroke="rgba(201,168,76,0.4)" stroke-width="1.5"/>
  <text x="633" y="158" font-family="'Cinzel', Georgia, serif" font-size="9" letter-spacing="2" fill="rgba(201,168,76,0.5)">代码精修 · 局部重构</text>
  <text x="633" y="188" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#E4D080">Cursor / Codex</text>
  <line x1="633" y1="200" x2="763" y2="200" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/>
  <text x="633" y="226" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.55)">代码融合</text>
  <text x="633" y="248" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.55)">局部重构</text>
  <text x="633" y="270" font-family="Georgia, serif" font-size="12" fill="rgba(201,168,76,0.55)">细节优化</text>

  <!-- Arrow 4→5 -->
  <line x1="785" y1="220" x2="797" y2="220" stroke="rgba(201,168,76,0.18)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <path d="M796 217 L801 220 L796 223" fill="none" stroke="rgba(201,168,76,0.25)" stroke-width="0.8" stroke-linecap="round"/>

