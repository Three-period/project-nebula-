name: Verify Project Nebula

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'public/**'
      - 'scripts/**'
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate site data, imports and regressions
        run: npm run check
